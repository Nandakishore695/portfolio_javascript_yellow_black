<body style="background-color: #0A1B27;">
    <div class="container my-5 col-lg-6 px-4 py-5">

            <form class="d-lg-flex gap-lg-2 gap-2 my-5" id="wordSearch">

                      <button class=" align-items-center btn btn-primary btn-lg px-4 rounded-3 my-1 my-lg-0">

    <script>
  // Initialize all tooltips on the page
  document.addEventListener("DOMContentLoaded", function () {
    const tooltipTriggerList = document.querySelectorAll('[data-bs-toggle="tooltip"]');
    [...tooltipTriggerList].map(el => new bootstrap.Tooltip(el));
  });
</script>
