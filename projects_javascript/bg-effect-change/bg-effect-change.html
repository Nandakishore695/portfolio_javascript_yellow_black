<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="author" content="Vishwanath Nandakishore" />
    <meta name="description"
        content="Front-end developer skilled in HTML, CSS, Bootstrap & JavaScript, building fast, responsive, SEO-friendly websites." />
    <link rel="shortcut icon" href="../../images/javascript_favicon.png" type="image/x-icon">
    <title>Background Effect</title>
    <link href="../../assets/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
    <a type="button" href="https://nandakishore695.github.io/portfolio_javascript_yellow_black/#projects"
            class="position-absolute top-0 end-0 p-3 m-3 btn-close bg-white bg-opacity-100 rounded-pill"
            aria-label="Close" data-bs-toggle="tooltip" data-bs-placement="top" data-bs-title="Back To Portfolio"></a>
    <div class="px-4 py-5 my-5 text-center "> 
        <h1 class="display-5 fw-bold text-body-emphasis my-5">Background Color</h1>
        <div class="col-lg-6 mx-auto">
            <div class="d-grid gap-2 d-sm-flex justify-content-sm-center">
                <button type="button" class="btn btn-lg px-4 gap-3" id="purple" style="background-color: #9A59B5;">Purple</button> 
                <button type="button" class="btn btn-lg px-4" id="blue" style="background-color: #3399DB;">Blue</button> 
                <button type="button" class="btn btn-lg px-4" id="red" style="background-color: #E84C3D;">Red</button> 
                <button type="button" class="btn btn-lg px-4" id="green" style="background-color: #2CCC70;">Green</button> 
                <button type="button" class="btn btn-lg px-4" id="yellow" style="background-color: #F1C40F;">Yellow</button> 
                <button type="button" class="btn btn-lg text-black px-4" id="teal" style="background-color: #1BBC9A;">Teal</button> 
            </div>
        </div>
    </div>

    <script>
    // Initialize all tooltips on the page
    document.addEventListener("DOMContentLoaded", function () {
        const tooltipTriggerList = document.querySelectorAll('[data-bs-toggle="tooltip"]');
        [...tooltipTriggerList].map(el => new bootstrap.Tooltip(el));
    });
    </script>
    <script src="../assets/js/bootstrap.bundle.min.js"></script>
    <script src="../bg-effect-change/bg-effect-change.js"></script>
</body>

</html>
